name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    uses: wearetechnative/reusable_workflow_terraform/.github/workflows/lint.yml@v1
    with:
      # This module declares configuration_aliases. As a root module there is no
      # aliased provider configured, so terraform validate reports
      # "missing provider" by design rather than because anything is wrong.
      skip-validate: true
